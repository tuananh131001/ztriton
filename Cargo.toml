[package]
name = "ztriton"
version = "0.0.7"
edition = "2024"
rust-version = "1.100"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libmpv2 = "7"
libmpv2-sys = "4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
security-framework = "3"
unicode-segmentation = "1"
log = "0.4"
env_logger = "0.11"
smallvec = "1"
url = "2"
parking_lot = "0.12"
futures = "0.3"
# GPU video path: offscreen CGL context, GL bindings and IOSurface-backed
# CVPixelBuffers (core-video must match the version gpui uses).
cgl = "0.3"
gl = "0.14"
core-video = "0.4.3"
core-foundation = "0.10"
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
unwrap_used = "deny"
