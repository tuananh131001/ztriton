name: Betterleaks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.10.0
  BETTERLEAKS_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so secrets committed and later removed are still caught.
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/betterleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Scan git history
        run: betterleaks git . --verbose --redact --no-banner
